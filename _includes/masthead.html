{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button aria-label="Navigation menu" aria-controls="navigation-links" aria-expanded="false"><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist">
            <span class="site-name-label">{{ site.title }}</span>
            <a class="phone-home-link" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          </li>
          <li class="masthead__menu-item desktop-about{% if page.url == '/' %} selected{% endif %}"><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul id="navigation-links" class="hidden-links hidden"></ul>
        <template id="phone-menu-items">
            {% unless page.url == '/' or page.url == '/index.html' %}
              <li><a href="{{ '/' | relative_url }}">Home</a></li>
            {% endunless %}
            {% for link in site.data.navigation.main %}
              {% if page.url != link.url %}
                <li><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
              {% endif %}
            {% endfor %}
        </template>
      </nav>
    </div>
  </div>
</div>
